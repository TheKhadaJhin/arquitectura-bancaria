<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1250" viewBox="0 0 1640 1250" role="img" aria-labelledby="title desc">
<title id="title">Arquitectura propuesta de la app bancaria con asistente de IA</title>
<desc id="desc">Cinco capas: cliente, gateway, backend modular, persistencia e integración. El orquestador pertenece al backend, consulta módulos bancarios y se conecta al modelo de IA. La ejecución transaccional exige confirmación validada en el servidor.</desc>
