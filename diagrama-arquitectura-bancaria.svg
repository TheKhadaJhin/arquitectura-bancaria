<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1620" viewBox="0 0 1920 1620" role="img" aria-labelledby="title desc">
<title id="title">Arquitectura propuesta para la app bancaria</title>
<desc id="desc">Identidad a la izquierda; app y gateway arriba; backend modular en el centro; persistencia e integración externa como ramas inferiores. Contornos punteados, fondo oscuro y notas técnicas junto a los componentes.</desc>
